name: Deploy to Aliyun ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aliyun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 有域名后在仓库 Variables 里设置 SITE_URL（如 https://example.com）；未设置时用服务器 IP。
      SITE_URL: ${{ vars.SITE_URL || format('http://{0}', secrets.DEPLOY_HOST) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # .well-known/ 是宝塔申请和续签 Let's Encrypt 证书时写入的验证文件（属主 root），不能被 --delete 删掉
      - name: Upload with rsync
        run: |
          rsync -az --delete --exclude=/.well-known/ --exclude=/.user.ini -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20" \
            dist/ "deploy@${{ secrets.DEPLOY_HOST }}:/var/www/blog/"
